services:
  db:
    image: postgres:17
    container_name: classq-db
    environment:
      POSTGRES_USER: classq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: classq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classq -d classq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: